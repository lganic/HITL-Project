[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-se"
version = "0.2.3"
description = "Persistent human-in-the-loop agentic software engineering prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hitl-se = "hitl_se.cli:main"
hitl-se-gui = "hitl_se.gui:main"

[tool.setuptools.packages.find]
include = ["hitl_se*"]

[tool.setuptools.package-data]
hitl_se = ["web/*.html", "web/*.css", "web/*.js"]
